<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>To-Do List | Arch Technologies</title>

    <meta
        name="description"
        content="A responsive To-Do List web application built using HTML, CSS and JavaScript."
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header class="app-header">

        <div class="container">

            <h1>My To-Do List</h1>

            <p>
                Organize your tasks and stay productive.
            </p>

        </div>

    </header>


    <!-- =========================
         MAIN APPLICATION
         ========================= -->

    <main class="container">

        <section class="todo-app">

            <!-- =========================
                 ADD TASK
                 ========================= -->

            <div class="task-input-section">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="addTaskBtn"
                >
                    Add Task
                </button>

            </div>


            <!-- =========================
                 TASK INFORMATION
                 ========================= -->

            <div class="task-info">

                <p>
                    Tasks:
                    <span id="taskCount">0</span>
                </p>

            </div>


            <!-- =========================
                 TASK LIST
                 ========================= -->

            <div class="task-list-container">

                <ul id="taskList">
                    <!-- Tasks will be added here by JavaScript -->
                </ul>


                <!-- Empty state -->

                <div
                    id="emptyMessage"
                    class="empty-message"
                >
                    <p>No tasks yet.</p>

                    <span>
                        Add your first task above.
                    </span>
                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer>

        <div class="container">

            <p>
                © <span id="currentYear"></span>
                Arch Technologies
            </p>

        </div>

    </footer>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script src="script.js"></script>

</body>
</html>
